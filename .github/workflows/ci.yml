name: ReconBench CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-gates:
    name: Scaffold, core purity, integration, and image gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.19
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --project backend --all-groups --locked
          npm ci --prefix web

      - name: Generate ephemeral service credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      # 1. Lint, type checks, and architecture contracts
      - name: Lint and type check
        run: make check-static

      # 2. Unit, parser, property, and scenario smoke tests
      # Tesseract lets the OCR-marked parser tests run instead of skipping.
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Run Python and web smoke tests
        run: make test

      - name: Install Playwright Chromium
        run: npm exec --prefix web -- playwright install --with-deps chromium

      - name: Run browser acceptance workflows
        run: npm run test:e2e --prefix web

      # 3. PostgreSQL and object-store integration checks
      - name: Start PostgreSQL and MinIO
        run: docker compose --env-file .env.example up -d postgres minio

      - name: Wait for integration services
        run: |
          RB_DATABASE_URL="postgresql+psycopg://reconbench:${POSTGRES_PASSWORD}@127.0.0.1:15432/reconbench" \
          RB_S3_ENDPOINT_URL=http://127.0.0.1:9000 \
          RB_S3_REGION=us-east-1 \
          RB_S3_BUCKET=reconbench-local \
          RB_S3_API_ACCESS_KEY=reconbench-local \
          RB_S3_API_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
          RB_PUBLIC_BASE_URL=http://localhost:5173 \
          uv run --project backend python scripts/wait_for_services.py --attempts 60 --delay 2

      - name: Verify database and object store
        run: |
          RB_DATABASE_URL="postgresql+psycopg://reconbench:${POSTGRES_PASSWORD}@127.0.0.1:15432/reconbench" \
          RB_S3_ENDPOINT_URL=http://127.0.0.1:9000 \
          RB_S3_REGION=us-east-1 \
          RB_S3_BUCKET=reconbench-local \
          RB_S3_API_ACCESS_KEY=reconbench-local \
          RB_S3_API_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
          RB_PUBLIC_BASE_URL=http://localhost:5173 \
          uv run --project backend pytest backend/tests/integration -q

      - name: Run Procrastinate lifecycle spike
        run: |
          RB_DATABASE_URL="postgresql+psycopg://reconbench:${POSTGRES_PASSWORD}@127.0.0.1:15432/reconbench" \
          uv run --project backend python -m scripts.spikes.sp1_procrastinate

      - name: Stop integration services
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

      # 4. Golden-set fail-closed harness
      - name: Run golden-set harness and false-Matched self-check
        run: make golden

      - name: Save golden-set report
        run: |
          mkdir -p artifacts
          uv run --project backend python scripts/golden_run.py --output artifacts/golden-set-report.json

      - name: Upload golden-set report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reconbench-golden-set-report
          path: artifacts/golden-set-report.json
          if-no-files-found: error

      # 5. Pure-engine rules hash
      - name: Verify rules hash
        run: uv run --project backend python scripts/check_rules_hash.py

      - name: Require engine version bump for changed core rules
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --project backend python scripts/check_engine_version.py --base-ref "$BASE_REF"

      # 6. Lockfile advisories, image build, and SBOM
      - name: Audit locked dependencies
        run: make audit

      - name: Build API image
        run: docker build --file deploy/backend.Dockerfile --tag reconbench-api:ci .

      - name: Build web image
        run: docker build --file deploy/web.Dockerfile --tag reconbench-web:ci .

      - name: Build local MinIO image
        run: docker build --file deploy/minio.Dockerfile --tag reconbench-minio:ci .

      - name: Generate source and image SBOMs
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD:/source" anchore/syft:v1.52.0 dir:/source -o cyclonedx-json=/source/artifacts/sbom-source.cdx.json
          for image in api web minio; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts:/artifacts" anchore/syft:v1.52.0 "reconbench-$image:ci" -o "cyclonedx-json=/artifacts/sbom-$image.cdx.json"
          done

      - name: Scan container images
        run: |
          # Reuse Trivy's vulnerability database across images in this job.
          for image in api web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v reconbench-trivy-cache:/root/.cache \
              docker.io/aquasec/trivy:0.74.0 image \
              --ignore-unfixed --exit-code 1 --severity CRITICAL,HIGH \
              "reconbench-$image:ci"
          done

          # G-28 keeps archived MinIO Community local-only until a supported
          # object store is selected. Scan and report it, but do not gate CI on it.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v reconbench-trivy-cache:/root/.cache \
            docker.io/aquasec/trivy:0.74.0 image \
            --exit-code 0 --severity CRITICAL,HIGH reconbench-minio:ci

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reconbench-phase-1-sboms
          path: artifacts/*.cdx.json
          if-no-files-found: error

  engine-reproducibility:
    name: Reconciliation CLI reproducibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.19
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --project backend --all-groups --locked

      - name: Run synthetic CLI bundle
        run: uv run --project backend python -m reconbench_core.cli run fixtures/cli-smoke --config fixtures/cli-smoke/config.json --run-date 2026-04-10 --out artifacts/reconciliation.json

      - name: Upload reconciliation result
        uses: actions/upload-artifact@v7.0.1
        with:
          name: engine-output-${{ matrix.os }}
          path: artifacts/reconciliation.json
          if-no-files-found: error

  compare-engine-reproducibility:
    name: Compare Linux and Windows reconciliation outputs
    needs: engine-reproducibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download Linux engine output
        uses: actions/download-artifact@v8
        with:
          name: engine-output-ubuntu-24.04
          path: artifacts/linux

      - name: Download Windows engine output
        uses: actions/download-artifact@v8
        with:
          name: engine-output-windows-2025
          path: artifacts/windows

      - name: Compare exact result bytes
        run: python scripts/compare_engine_outputs.py artifacts/linux/reconciliation.json artifacts/windows/reconciliation.json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: >-
          docker run --rm --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          git --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore /repo

  phase2-database:
    name: Phase 2 PostgreSQL schema gates
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: reconbench_phase2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2-ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reconbench_phase2_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RB_ENV: ci
      RB_MIGRATOR_DATABASE_URL: postgresql+psycopg://postgres:phase2-ephemeral-ci-only@127.0.0.1:5432/reconbench_phase2_ci
      RB_DATABASE_URL: postgresql+psycopg://postgres:phase2-ephemeral-ci-only@127.0.0.1:5432/reconbench_phase2_ci
      RB_PHASE2_TEST_DATABASE_URL: postgresql+psycopg://postgres:phase2-ephemeral-ci-only@127.0.0.1:5432/reconbench_phase2_ci
      RB_BOOTSTRAP_EMAIL: phase2-manager@example.invalid
      RB_BOOTSTRAP_DISPLAY_NAME: Synthetic Phase 2 Manager
      RB_BOOTSTRAP_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=4$c3ludGhldGlj$bm90LWF1dGhlbnRpY2F0ZWQ
      RB_BOOTSTRAP_WORKSPACE_NAME: Synthetic Phase 2 Workspace
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.19
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --project backend --all-groups --locked

      - name: Build the previous schema
        run: uv run --project backend alembic -c backend/alembic.ini upgrade 0034

      - name: Test the migration on a copy of the previous schema
        run: uv run --project backend python scripts/check_migration_safety.py

      - name: Upgrade the disposable database to head
        run: uv run --project backend alembic -c backend/alembic.ini upgrade head

      - name: Check metadata drift and the planned index list
        run: |
          uv run --project backend python scripts/check_schema_drift.py
          uv run --project backend python scripts/check_phase2_catalog.py
          uv run --project backend python scripts/check_phase2_indexes.py

      - name: Verify the open Schema §13 decisions remain logged
        run: uv run --project backend python scripts/check_phase2_decisions.py

      - name: Verify seed idempotence
        run: |
          uv run --project backend python scripts/seed_database.py > seed-first.txt
          uv run --project backend python scripts/seed_database.py > seed-second.txt
          diff -u seed-first.txt seed-second.txt

      - name: Apply the pinned Procrastinate schema separately
        run: uv run --project backend procrastinate --app reconbench_app.db.procrastinate_schema.app schema --apply

      - name: Run Phase 2 PostgreSQL integration checks
        run: >-
          uv run --project backend pytest
          backend/tests/integration/test_phase2_database.py
          backend/tests/integration/test_phase2_readyz.py
          backend/tests/integration/test_configuration.py
          backend/tests/integration/test_ingestion.py
          backend/tests/integration/test_ai_assist_migration.py
          backend/tests/integration/test_ai_runner.py -q

      - name: Run Phase 4 database acceptance checks
        run: >-
          uv run --project backend pytest
          backend/tests/integration/test_phase4_task_411_413.py -q

      - name: Run AI settings API checks on a single-workspace clone
        run: >-
          uv run --project backend pytest
          backend/tests/integration/test_ai_settings_api.py -q

      - name: Run AI Assist hook and Home KPI checks
        run: >-
          uv run --project backend pytest
          backend/tests/integration/test_ai_h1.py
          backend/tests/integration/test_ai_h2.py
          backend/tests/integration/test_ai_h3.py
          backend/tests/integration/test_ai_h4.py
          backend/tests/integration/test_ai_vision.py
          backend/tests/integration/test_kpi_summary.py -q

      - name: Count ReconBench and queue tables
        run: uv run --project backend python scripts/check_phase2_table_count.py
