# Synthetic demo month for `make demo`.
#
# Every vendor, GSTIN, item, number, and date below is invented; no real
# supplier, buyer, or sample document was used. GSTINs carry valid checksums so
# the parsers treat them as well-formed. Expected outcomes for each invoice live
# in expected.yaml and come from the matching SCN fixture.
month: '2026-09'
run_date: '2026-09-30'
buyer:
  name: Demo Buyer Manufacturing Pvt Ltd
  gstin: 27AAACD7777M1Z0
vendors:
  SF:
    name: Shakti Fasteners Pvt Ltd
    gstin: 27AAACS1234A1Z2
  LP:
    name: Lotus Packaging Industries
    gstin: 27AABCL5678B1ZI
  BE:
    name: Bharat Electricals Co
    gstin: 27AAACB9999C1ZB
  VE:
    name: Vardhan Engineering Works
    gstin: 29AAAPV4321D1ZW

purchase_orders:
- number: DM-PO-101          # SCN-01 clean three-way match
  vendor: SF
  date: '2026-09-01'
  lines:
  - {code: HB-M10-50, description: Hex Bolt M10x50 Zinc Plated, hsn: '7318', uom: NOS, qty: '10', rate: '1250.00', gst: '18'}
- number: DM-PO-102          # SCN-02 partial deliveries against one PO
  vendor: LP
  date: '2026-09-02'
  lines:
