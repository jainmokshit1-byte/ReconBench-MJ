- {name: tally-purchase-vouchers.xml, zone: invoice, render: tally_xml, documents: [VE/1007A, VE/1007B, BE/1016]}
- {name: SF-26-27-0451.pdf, zone: invoice, render: pdf_text, documents: [SF/26-27/0451]}
- {name: SF-26-27-0478-scan.pdf, zone: invoice, render: pdf_scan, documents: [SF/26-27/0478]}
- {name: LP-26-27-1011-rescan.pdf, zone: invoice, render: pdf_scan, documents: [LP/26-27/1011]}
- {name: courier-scans.zip, zone: invoice, render: zip, members: [{name: unreadable-scan.pdf, render: pdf_unreadable}]}
