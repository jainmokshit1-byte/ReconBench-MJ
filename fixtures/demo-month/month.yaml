# How the month arrives: the same mix of exports, registers, PDFs, and scans a
# finance team uploads. `render` picks the generator; `documents` lists numbers.
files:
- {name: purchase-orders-sep.xml, zone: po, render: tally_xml, documents: [DM-PO-101, DM-PO-102, DM-PO-104, DM-PO-106, DM-PO-107, DM-PO-111, DM-PO-116]}
- {name: grn-register-sep.csv, zone: grn, render: csv, documents: [DM-GRN-101, DM-GRN-102A, DM-GRN-102B, DM-GRN-104A, DM-GRN-104B, DM-GRN-106, DM-GRN-107, DM-GRN-111, DM-GRN-116]}
