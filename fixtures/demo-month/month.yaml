- number: DM-PO-104          # SCN-04 second invoice exceeds the cumulative PO cap
  vendor: BE
  date: '2026-09-02'
  lines:
  - {code: CC-4SQ-90, description: Copper Cable 4 sq mm 90m Coil, hsn: '8544', uom: NOS, qty: '100', rate: '500.00', gst: '18'}
